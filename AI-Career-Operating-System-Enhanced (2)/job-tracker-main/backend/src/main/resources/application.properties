# Application
quarkus.application.name=jobs-tracker

# ── MySQL datasource ──────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:jobs}
quarkus.datasource.password=${DB_PASSWORD:jobs}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/jobs_tracker}

# ── Hibernate ORM ─────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%dev.quarkus.hibernate-orm.log.sql=false

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ── Anthropic API ─────────────────────────────────────────────────────────────
jobs.anthropic.api-key=${ANTHROPIC_API_KEY:}
jobs.anthropic.model=claude-haiku-4-5-20251001

# ── Sync config ───────────────────────────────────────────────────────────────
jobs.sync.enabled=${SYNC_ENABLED:true}

# ── CORS (local dev) ──────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.matheus".level=DEBUG
